# Model roles (plan §12). Agents' LLM calls resolve roles here via vakeel_sahayak.models.factory.
llm:
  agents_14b:     {model: Qwen/Qwen3-14B-AWQ, runtime: vllm, where: ada, used_by: [sutradhar, vakeel, abhiyojak, pairokar]}
  munshi_4b:      {model: Qwen/Qwen3-4B, quant: int4, runtime: local, where: laptop, adapter: null, used_by: [munshi]}
  extractor_4b:   {model: Qwen/Qwen3-4B, quant: int4, runtime: local, where: laptop, adapter: models/extractor-qlora, used_by: [peshkar]}
  fallback_8b:    {model: Qwen/Qwen3-8B, quant: int4, runtime: local, where: laptop}  # demo fallback if Ada is unavailable
  teacher:        {model: Qwen/Qwen3-32B-AWQ, runtime: vllm, where: ada, api_alternative: mistral-small, pilot: week-1, public_orders_only: true}
  eval_labeler:   {model: meta-llama/Llama-3.1-8B-Instruct, quant: int4, runtime: local, where: laptop, system_use: false}  # never used by the system; must differ in family from the teacher
vision:
  default: {model: Qwen/Qwen3-VL-4B-Instruct, quant: 4bit, where: laptop}   # TODO: pick in week 1 on quality per GPU-second
  ada_eval: {model: Qwen/Qwen3-VL-8B-Instruct, where: ada}
  alternative: {model: Qwen/Qwen2.5-VL-7B-Instruct}
ocr: {primary: surya (en+hi), fallback: tesseract (eng+hin), layout: docling}
translation: {model: ai4bharat/indictrans2-indic-en, direction: hi-en}
asr: {candidates: [openai/whisper-large-v3-turbo, ai4bharat/indic-conformer], choice: TODO pick on dev}
embeddings: {model: BAAI/bge-m3, where: laptop, max_tokens_whole_doc: 8192}
bm25: {engine: tantivy via LanceDB}
nli: {system: microsoft/deberta-v3-large-mnli (TODO exact checkpoint), evaluation_only: MiniCheck}
privacy: {pii: presidio, legal_ner: InLegalNER}
test_construction_only: {translation_en_hi: facebook/nllb-200-distilled-600M, tts: ai4bharat/indic-parler-tts}

# Sarvam AI (external API; docs https://docs.sarvam.ai). OFF by default. See vakeel_sahayak/models/sarvam/policy.py.
# Mode: env VS_SARVAM=off|public|pseudonymised|consented wins; else `mode` applies when `enabled: true`; else off.
#   public         public or constructed data only (test-set construction, gold labels of public orders, teacher data, T8 speech)
#   pseudonymised  + client text that passes privacy.boundary.assert_pseudonymised
#   consented      + raw client pages and audio, only for cases whose counsel recorded a Sarvam consent event
# The key comes ONLY from the process environment (the variable is named in .env.example), never from this file or any committed file.
# Data retention: Sarvam's docs say request/response retention is a workspace setting (a default plus an optional per-product
# override under "Data retention" in the dashboard) and that speech products delete data after processing by default.
# RECOMMENDED: set the workspace default and every per-product override to the shortest/zero-retention option before turning
# on `pseudonymised` or `consented`. The API has no per-request retention flag, so this cannot be enforced from code; confirm
# the setting in the dashboard (the docs pages we could fetch do not describe the exact steps).
sarvam:
  enabled: false
  mode: public
  base_url: https://api.sarvam.ai
  auth_header: api-subscription-key
  timeout_s: 120
  retries: {max: 5, base_delay_s: 1.0, max_delay_s: 60.0}   # retry only 429 (rate limit), 500, 503 and transport errors (docs: errors-troubleshooting)
  endpoints:
    chat: /v1/chat/completions
    translate: /translate
    transliterate: /transliterate
    language_id: /text-lid
    speech_to_text: /speech-to-text
    text_to_speech: /text-to-speech
    vision_digitise: /doc-ai/v1/job/digitise
    vision_status: /doc-ai/v1/job/{job_id}/status
    vision_download: /doc-ai/v1/job/{job_id}/download-url
  chat: {model: sarvam-105b, reasoning_effort: null, strict_json: false, max_tokens_cap: 4096}   # null disables thinking; the plan's token cap applies (Starter 4096)
  translate: {model: sarvam-translate:v1, mode: formal, max_chars: {"mayura:v1": 1000, "sarvam-translate:v1": 2000}, numerals_format: international}
  speech_to_text: {model: "saaras:v4", mode: codemix, max_seconds: 30}   # code-mix aware; sync REST takes at most 30 s, longer WAV is split
  text_to_speech: {model: "bulbul:v4-flash", speaker: simran_en_customer, sample_rate: 24000}
  vision: {output_format: md, poll_interval_s: 2.0, timeout_s: 300, use_for_ocr: false}   # use_for_ocr: also serve the OCR rung (confidence = pages succeeded / total)
  use: {ocr: true, vision: true, translation: true, asr: true, llm: true, tts: true, language_id: true}   # per-capability switches (all still gated by the mode)
# Independent non-Qwen labeler/teacher OPTION (documented, never the default): set llm.eval_labeler.runtime / llm.teacher.runtime
# to sarvam (model sarvam-105b) or env VS_LABELER=sarvam / VS_TEACHER=sarvam. Public orders only; model_family('sarvam-105b') = 'sarvam'.
# Agent roles: set llm.agents_14b.runtime: sarvam to use Sarvam-105B for the Ada-side agents (pseudonymised text only; falls back
# to the configured fallback runtime when Sarvam is off, blocked or unavailable).

# OpenAI (external API; hosted LLM allowed since 2026-10-24, team budget 5.00 USD in total). OFF by default. Privacy gate: the same as
# Sarvam's (vakeel_sahayak/models/sarvam/policy.py, `authorize(provider="openai")`). Mode: env VS_EXTERNAL=off|public|pseudonymised|consented
# (VS_SARVAM is Sarvam's own alias); else `mode` applies when `enabled: true`; else off. A call with no declared data scope is blocked.
# The key comes ONLY from the process environment (the variable named in .env.example), never from this file or any committed file.
# Roles: `runtime: openai` on an llm role (or env VS_LLM_BACKEND=openai for the agent roles) uses it, falling back to the local client when
# blocked, over the cap or failing. Labeler/teacher: env VS_LABELER=openai / VS_TEACHER=openai (public orders only); family 'openai'.
# HARD SPENDING CAP (models/openai/ledger.py): cap_usd defaults to 4.50; env VS_OPENAI_CAP_USD overrides it; code clamps any value to 5.00.
# Every call is reserved against the SQLite ledger at its worst case BEFORE the request, so the total can never exceed the cap.
# Optional per-run soft cap: run_cap_usd / env VS_OPENAI_RUN_CAP_USD. `make openai-spend` prints totals.
# Verified 2026-10-24 against OFFICIAL docs (re-check before relying on prices):
#   pricing         https://developers.openai.com/api/docs/pricing   (platform.openai.com/docs/pricing redirects here), standard tier, USD per 1M tokens
#   models          https://developers.openai.com/api/docs/models/gpt-6-luna  (Chat Completions + Responses + Batch; structured outputs; reasoning.effort none|low|medium|high|xhigh|max, default medium; 128k max output)
#                   https://developers.openai.com/api/docs/models/gpt-5-nano  (cheapest list price but marked DEPRECATED, so not the default)
#                   the 4.1-generation nano model is SHUT DOWN and the 4o-generation mini costs more, so neither is in the table
#   chat endpoint   https://developers.openai.com/api/reference/chat-completions/overview  (POST /v1/chat/completions; max_completion_tokens, reasoning_effort, response_format json_schema{name,schema,strict}|json_object,
#                   usage.prompt_tokens_details.cached_tokens; Responses API is recommended for new projects, Chat Completions still supported)
#   structured out  https://developers.openai.com/api/docs/guides/structured-outputs  (strict: true needs additionalProperties:false and all properties required)
#   reasoning       https://developers.openai.com/api/docs/guides/reasoning  (reasoning tokens are billed as output tokens; hence max_completion_tokens bounds them too)
#   rate limits     https://developers.openai.com/api/docs/guides/rate-limits  (Build tier = 5 USD total credit purchased: Luna 5,000 RPM / 2,000,000 TPM; auth example: Authorization: Bearer)
# Default model: gpt-6-luna, the cheapest non-deprecated model on the pricing page (0.10 / 0.01 cached / 0.50). Not verified from the docs: whether
# Luna accepts `temperature` and reasoning_effort "none"; the client drops a rejected parameter and repeats the call (a rejected request is not billed).
openai:
  enabled: false
  mode: public
  base_url: https://api.openai.com
  auth: bearer   # Authorization: Bearer <key from the environment>
  timeout_s: 120
  retries: {max: 4, base_delay_s: 1.0, max_delay_s: 30.0}   # retry only 429 (not insufficient_quota), 5xx and transport errors
  endpoints: {chat: /v1/chat/completions}
  chat: {model: gpt-6-luna, reasoning_effort: none, strict_json: auto, max_tokens_cap: 4096, reasoning_headroom_tokens: 0, send_temperature: true}
  prices:   # USD per 1M tokens (== micro-USD per token); a model absent from this table is refused (its cost could not be capped)
    gpt-6-luna:   {input: 0.10, cached_input: 0.01,  output: 0.50}
    gpt-5.6-luna: {input: 0.20, cached_input: 0.02,  output: 1.20}
    gpt-5.4-nano: {input: 0.20, cached_input: 0.02,  output: 1.25}
    gpt-5-nano:   {input: 0.05, cached_input: 0.005, output: 0.40}   # deprecated
    gpt-5-mini:   {input: 0.25, cached_input: 0.025, output: 2.00}
  cap_usd: 4.50          # effective default; never above 5.00 (clamped in code)
  run_cap_usd: null      # optional soft cap per run
  ledger: {path: null, cache_path: null}   # null = <data dir>/openai/ledger.sqlite and cache.sqlite (data/ is untracked)
  use: {llm: true}

# Weight tiers for scripts/download_models.sh (`make models`, `make models-dry-run`). Hosted backends (Sarvam, OpenAI) need no weights.
# Sizes are the bytes of the files the script fetches (include globs), read from the Hugging Face model pages' file lists on 2026-10-24.
# T0 = offline stand-ins (nothing to download); T1 = small helpers that fit an 8 GB laptop GPU; T2 = local LLMs for a laptop/GPU box;
# T3 = larger models for Ada. T2 and T3 are optional now that hosted LLMs are the default.
weights:
  T0: {note: "offline stand-ins (hashed-ngram embedder, rule-based stubs); no download", models: []}
  T1:
    models:
      - {id: BAAI/bge-m3, role: embeddings, license: MIT, include: ["*.json", "pytorch_model.bin", "sentencepiece.bpe.model", "tokenizer*", "1_Pooling/*", "modules.json"], approx_bytes: 2271145830}
      - {id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli, role: nli, license: MIT, include: ["*.json", "model.safetensors", "spm.model", "tokenizer*"], approx_bytes: 870182606}
      - {id: lytang/MiniCheck-RoBERTa-Large, role: faithfulness (evaluation), license: MIT, include: ["*.json", "pytorch_model.bin", "merges.txt", "vocab.json", "tokenizer*"], approx_bytes: 1421577710}
      - {id: openai/whisper-small, role: asr, license: Apache-2.0, include: ["*.json", "model.safetensors", "merges.txt", "vocab.json", "tokenizer*"], approx_bytes: 966995080}
  T2:
    models:
      - {id: Qwen/Qwen3-4B, role: munshi/extractor LLM (4-bit at load), license: Apache-2.0, include: ["*"], approx_bytes: 8050000000}
      - {id: Qwen/Qwen3-VL-4B-Instruct, role: vision, license: Apache-2.0, include: ["*"], approx_bytes: 9000000000}
      - {id: ai4bharat/indictrans2-indic-en-dist-200M, role: hi-en translation, license: MIT, gated: auto, include: ["*"], approx_bytes: 913353672}
  T3:
    models:
      - {id: Qwen/Qwen3-14B-AWQ, role: agents (vLLM on Ada), license: Apache-2.0, include: ["*"], approx_bytes: 10000000000}
      - {id: Qwen/Qwen3-32B-AWQ, role: teacher (vLLM on Ada), license: Apache-2.0, include: ["*"], approx_bytes: 20000000000}
