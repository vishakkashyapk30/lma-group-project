# Rights Radar rules and sources (plan §7.3, Appendix C). 'last_verified' is set in week 0 after checking the bare act.
default_bail:
  rule: "Release if no charge sheet within 90 days (death, life or >=10 years) or 60 days (other); day 1 = first remand; right lapses if charge sheet filed before application; 'may extend to ten years' -> CHECK"
  sources: ["BNSS s.187(3) (CrPC s.167(2))", "ED v. Kapil Wadhawan (2023)", "M. Ravindran v. DRI (2020)"]
  statuses: [ELIGIBLE, NOT_YET, WINDOW_CLOSED, CHECK]
  last_verified: null
undertrial_limit:
  rule: "Release on bond after 1/2 of max sentence, or 1/3 for a first-time offender; not for death or life"
  sources: ["BNSS s.479 (CrPC s.436A)", "In Re Inhuman Conditions in 1382 Prisons (2024)"]
  statuses: [ELIGIBLE, NOT_YET, NOT_APPLICABLE, CHECK]
  last_verified: null
notice_of_appearance:
  rule: "Offences up to 7 years: notice of appearance is the norm; arrest needs recorded reasons"
  sources: ["BNSS s.35(3) (CrPC s.41A)", "Arnesh Kumar v. State of Bihar (2014)", "Satender Kumar Antil v. CBI (2022)"]
  statuses: [FLAG, OK, UNKNOWN]
  last_verified: null
grounds_of_arrest:
  rule: "Grounds communicated; in writing, understood language, >=2 hours before production (Mihir Rajesh Shah); applicability to earlier arrests contested -> CHECK"
  sources: ["Art. 22(1)", "BNSS s.47 (CrPC s.50)", "Vihaan Kumar v. State of Haryana (2025)", "Mihir Rajesh Shah v. State of Maharashtra (2025)"]
  statuses: [FLAG, OK, UNKNOWN, CHECK]
  last_verified: null
production_24h:
  rule: "Produce before a magistrate within 24 hours of arrest, excluding travel time"
  sources: ["Art. 22(2)", "BNSS s.58 (CrPC s.57)"]
  statuses: [FLAG, OK, CHECK]
  last_verified: null
antil_category:
  rule: "A: up to 7 years (not B/D); B: death, life or >7 years; C: special acts with strict bail conditions; D: economic offences not under special acts"
  sources: ["Satender Kumar Antil v. CBI (2022)"]
  statuses: [A, B, C, D, CHECK]
  last_verified: null
statutory_bar:
  rule: "Twin conditions apply"
  sources: ["NDPS s.37", "UAPA s.43D(5)", "PMLA s.45"]
  statuses: [BAR_APPLIES, NOT_APPLICABLE]
  last_verified: null
