  - {id: S7,    tier: must, phase: 1, backend: offline, n: 100, runs: 1, testset: T2, ratio: 0, claims: [C21], status: planned}
  - {id: "P5-P8", tier: should, phase: 1, backend: offline, n: 100, runs: 1, testset: T2, ratio: 0, claims: [C21], status: planned}
  - {id: "S17*", tier: must, phase: 1, backend: offline, n: 60, runs: 1, testset: T7, ratio: 0, claims: [C37], status: planned, note: "offline stand-in: attack-success numbers describe the stand-in, not a model"}
  # ---- phase 2: OpenAI gpt-6-luna, 50 dev cases each (ledger total must stay <= 4.40 USD)
