  - {id: S3,   tier: must, phase: 3, backend: sarvam, runner: satvik, n: 50, runs: 1, ratio: 1.0, claims: [C6], status: planned}
  - {id: S3b,  tier: must, phase: 3, backend: sarvam, runner: satvik, n: 50, runs: 1, ratio: 1.0, claims: [C6], status: planned}
  - {id: S8,   tier: must, phase: 3, backend: sarvam, runner: satvik, n: 50, runs: 1, ratio: 0.83, claims: [C13], status: planned}
  - {id: S9,   tier: must, phase: 3, backend: sarvam, runner: satvik, n: 50, runs: 1, ratio: 0.83, claims: [C7], status: planned}
  - {id: S10,  tier: must, phase: 3, backend: sarvam, runner: satvik, n: 50, runs: 1, ratio: 0.83, claims: [C8], status: planned}
  - {id: S1,   tier: must, phase: 3, backend: sarvam, runner: satvik, n: 25, runs: 1, ratio: 1.17, claims: [C10], status: planned}
