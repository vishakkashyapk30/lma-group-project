  - {id: S14d, tier: should, phase: 4, backend: ada, n: 25, runs: 1, ratio: 1.0, claims: [C31], status: planned}
  - {id: S11b, tier: could, phase: 4, backend: ada, n: 25, runs: 1, ratio: 1.0, claims: [C7], status: planned}
