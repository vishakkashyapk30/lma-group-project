# Eval run registry (plan §15, §17). Each job runs as resumable shards of about 5 h on an Ada interactive session.
# Hosted models are CAPPED resources (see `budgets:` at the end): one headline block on OpenAI gpt-6-luna (5 USD) and one pilot-size block on Sarvam-105B (INR 25). Everything else stays on Ada (Qwen) or is marked `deferred`. An arm is only comparable with Full on the SAME backend, so each hosted block carries its own Full run.
shard_hours: 5
jobs:
  teacher_dossiers: {where: ada, model: teacher, node_hours: 60}
  rq1_full:         {where: ada, systems: [full, b0, b1, b4], runs: 3, cases: 200, testset: T1, node_hours: 82}
  rq1_b0l_b0s_b6:   {where: ada, systems: [b0l, b0s, b6], runs: 1, cases: 200, testset: T1, node_hours: 2.5}   # job 5 of the job map; B6 needs no model
  rq1_b2_b3:        {where: ada, systems: [b2, b3], runs: 1, cases: 200, testset: T1}
  ablations:        {where: ada, ids: [A1, A2, A3, A4, A6, A7, A8, A9], cases: 100, node_hours: 50}
  a5_extractors:    {where: ada, variants: [finetuned_4b, base_4b, prompted_32b], inputs: 400, node_hours: 6}
  a10_knockouts:    {where: laptop+ada, level: retrieval_and_slot_fill}
  rq2_vision:       {where: ada, pages: 2400, node_hours: 3}
  rq2_full:         {where: ada, bundles: 100, node_hours: 7.5}
  f2_change_sets:   {where: ada, updates: 180, noop_controls: 60, node_hours: 18}
  f1_f5_f6:         {where: ada, cases: 200, node_hours: 6.5}
  f3_baselines:     {where: ada, scenarios: 1000, node_hours: 10}
  f4_nocache:       {where: ada, node_hours: 5}
  t6_tool_calling:  {where: ada, questions: 150, runs: 3, node_hours: 2}
  t7_safety:        {where: ada, scenarios: 60, runs: 3, node_hours: 9}
  qlora:            {where: ada-batch, gpus: 1, runs: 3, max_days: 1.5}
  # --- VI-03 carve-outs (not plan rows): the hosted blocks that the OpenAI cap and the Sarvam cap pay for. Each carries its own Full run (the same backend as its arms).
  openai_sparring_block: {where: openai, systems: [full, A2, A8, A9, S8, S9], cases: 100, testset: T1}
  rq1_secondary_sarvam: {where: sarvam, systems: [full, b1, b4], runs: 1, cases: 6, testset: T1}   # pilot-size only (6 cases, about INR 21 of the INR 25 cap): shows the path and the per-case cost; no test is run on n=6
  # --- VI-03: one job per implemented variant (evaluation plan 7.2 rows 15-33; ids in `Switches.implemented_variants()`). Sizes are the plan's targets; the
  # floor sizes are in docs/evaluation-plan.md 7.2. `runs` is absent where the plan says one run. Costs come from `estimate:` below (`driver plan --job <name>`).
  s8_self_critique:   {where: ada, systems: [S8], cases: 100, testset: T1, node_hours: 6.25}       # plan job 15 (C13)
  s9_sampling_critic: {where: ada, systems: [S9], cases: 100, testset: T1, node_hours: 6.25}       # plan job 16 (C7)
  s10_no_isolation:   {where: ada, systems: [S10], cases: 100, testset: T1, node_hours: 6.25}      # plan job 17 (C8)
  s1_critique_retrieval: {where: ada, systems: [S1], cases: 100, testset: T1, node_hours: 8.75}   # plan job 18
  s3_stopping:        {where: ada, systems: [S3, S3b], cases: 100, testset: T1, node_hours: 15}    # plan job 19 (C6)
  s7_gap_reread:      {where: laptop, systems: [full, S7], cases: 100, testset: T2, node_hours: 1}    # plan job 20: sequential arm is Full; needs T2 bundles as case rows
  s15_output_format:  {where: ada, systems: [S15], cases: 100, testset: T1, node_hours: 5}         # plan job 21; S15b is declared but not built (see `exclusions`)
  s17_defences:       {where: ada, systems: [S17, S17b, S17c, S17d], runs: 3, cases: 60, testset: T7, node_hours: 7}  # plan job 22 (C37); needs T7 scenarios as case rows
  s2_adaptive_depth:  {where: ada, systems: [S2], cases: 100, testset: T1, node_hours: 5}          # plan job 25
  s6_b5_router:       {where: ada, systems: [S6, B5], cases: 100, testset: T1, node_hours: 12.5}   # plan job 26
  s12_topology:       {where: ada, systems: [S12, S12b], cases: 100, testset: T1, node_hours: 12.5}  # plan job 27
  s14_batch:          {where: ada, systems: [S14, S14d], cases: 100, testset: T1, node_hours: 12}  # plan job 28: one shared retrieval cache per run (a batch)
  s14_scheduling:     {where: laptop, systems: [S14b, S14c], testset: T5, node_hours: 0}           # plan job 28, scheduler arms: read by Pairokar only, measured on T5 (counted in s14_batch)
  s16_chunking:       {where: laptop, systems: [S16, S16b], cases: 100, testset: T1, node_hours: 0.5}  # plan job 29: the chunking study (`compare_strategies`); a per-case run equals Full
  s4_s5_retrieval:    {where: laptop, systems: [S4, S5], cases: 100, testset: T1}                  # retrieval-level claims (F-retrieval); plan 7.1: no Ada
  s11_review_debate:  {where: ada, systems: [S11, S11b, S11c], cases: 100, testset: T1, node_hours: 7.5}  # plan job 32 (tier C)
  s13_workflow_search: {where: ada, systems: ["S13:stopping=llm"], cases: 50, testset: T1, node_hours: 36, runner: workflow_search}  # plan job 33 (tier C): dev only; the grid point is the smoke arm
  s18_authority_stance: {where: ada, systems: [S18], cases: 100, testset: T1}                      # not in the plan (sweep 4)
  p_munshi_variants:  {where: ada, systems: [P5, P6, P7, P8], cases: 100, testset: T2, node_hours: 7.5}  # Munshi switches on bundles (P5, P6 as switches; P1-P4 are the rq2 pipelines); needs T2 bundles as case rows
  # --- Gold-source sensitivity (owner decision 2026-10-26): PRIMARY gold = agreed (rules + non-Qwen labeler, span-grounded; data/testsets/t1), SECONDARY = rule-only (data/testsets/t1_rule_only).
  # One declared sensitivity analysis, not a new test family: the gold-dependent metrics of every system output that exists are rescored against the other gold. No model call, cost 0.
  # The scoring modules (eval/metrics/*) are Harshita's; while they are stubs the job raises NotImplementedError naming eval/metrics.
  gold_source_sweep:  {where: laptop, rescoring: true, model_calls: 0, testset: T1, gold_sources: [agreed, rule], systems_from: existing_outputs, node_hours: 0,
                       metrics: [M1, M2, M3, M4, M22, M36, M40, M46], claims: [C1, C2, C3, C7, C8, C10, C25, C28, C32, C33]}   # G1, G3, G4, G5, G6; G2 is not gold-source dependent; G7 is empty on T1 (C30 rests on T4)
laptop_jobs:
  embeddings: 20h
  eval_labels_llama: 30h
  minicheck: 10h
  t2_and_p1_p3_p5_p6: 15h
  extractor_on_t2_and_ocr_for_noise: 8h
  indictrans2_speech: 5h
  triage_and_ui_checks: 2h
statistics: {bootstrap_ci: 0.95, test: wilcoxon_signed_rank, correction: holm_bonferroni, repeats: {full: 3, b0: 3, b1: 3, b4: 3, others: 1}}

# --- VI-03: what `driver plan` and the validator read ---------------------------------------------------------------------------------------------------
# Measured numbers (data/eval/token_measure.json, 2026-10-25): the Full pipeline on gpt-6-luna, three T1 dev cases, OpenAI cache off, Gate 1 approved, Gate 2 closed.
estimate:
  source: data/eval/token_measure.json
  model: gpt-6-luna
  usd_per_case: 0.0078
  tokens_in_per_case: 70265
  tokens_out_per_case: 3963
  seconds_per_case: 172
  openai_cap_usd: 4.5          # the code's default run cap (hard cap 5.0); `make openai-spend` shows what is left
  # Tokens of a system relative to Full (1.0), from the evaluation plan 7.2 'Tokens or basis' column (Full cap 150K): ablations and sparring arms 125K, S1 175K, S2 100K, B0 family 10K.
  # A system not listed counts as 1.0: B1 and B4 are NOT measured here (B4 queries every store, so it is probably above 1.0), and the plan figure for A10 is a retrieval-only run.
  cached_input_share: 0.2009   # 14,116 of 70,265 input tokens were cached in the pilot (same share assumed on Sarvam, where cached input is priced lower)
  token_ratio:
    default: 1.0
    full: 1.0
    b0: 0.07
    b0l: 0.07
    b0s: 0.07
    b6: 0.0                    # rule baseline, no model
    A1: 0.83
    A2: 0.83
    A3: 0.83
    A4: 0.83
    A6: 0.83
    A7: 0.83
    A8: 0.83
    A9: 0.83
    S1: 1.17
    S2: 0.67
    S6: 0.83
    B5: 0.83
    S8: 0.83
    S9: 0.83
    S10: 0.83
    S12: 0.83
    S12b: 0.83
    S3: 1.0                    # 150K basis (plan job 19)
    S3b: 1.0
    S11: 1.0                   # 150K basis (plan job 32)
    S11b: 1.0
    S11c: 1.0

