# Tier (split.md appendix D and evaluation plan 7.2: A must, B should, C could, X not in the plan), the backend the job is planned on (the price of a Sarvam job is unknown: see `estimate.sarvam`), and the variant ids a job covers
# beyond its `systems` (A5 and A10 have jobs of their own shape). backend: openai (the hosted block under the 5 USD cap), sarvam (the two small Sarvam-105B blocks under the 25-unit cap), ada (Qwen on Ada), laptop (4060). status: deferred = not in the committed floor; run only if the window and caps allow (evaluation plan 7.4).
job_meta:
  openai_sparring_block: {tier: A, backend: openai, note: "Full plus the sparring 2x2 (A2, A8, A9) plus S8 and S9 on the first 100 cases, all on gpt-6-luna: the one coherent block the cap pays for (about 4.0 of 4.5 USD); S10, S1, S3 and the rest stay on Ada"}
  rq1_secondary_sarvam: {tier: A, backend: sarvam, note: "Full, B1, B4 on 6 cases on Sarvam-105B, the most INR 25 buys (about 18 case-runs at INR 1.15): a cost and path check, not a result. The large blocks (RQ1 main x3, ablations on 100 cases) cannot fit INR 25 and stay on OpenAI (5 USD), Ada or reduced floor sizes"}
  teacher_dossiers: {tier: A, backend: ada}
  rq1_full: {tier: A, backend: ada, note: "target 2400 case-runs (14 USD on gpt-6-luna): over the OpenAI cap, so it runs on Ada (Qwen); B1 and B4 also have a 6-case Sarvam block"}
  rq1_b0l_b0s_b6: {tier: A, backend: ada, note: "B0L on the local teacher role (Ada), B0S on the base 4B (local, small GPU or laptop), B6 needs no model"}
  rq1_b2_b3: {tier: A, backend: ada}
  ablations: {tier: A, backend: ada, note: "A1-A4, A6-A9 on 100 cases"}
  a5_extractors: {tier: A, backend: ada, covers: [A5], note: "Peshkar extraction only (3 extractors x 400 inputs); run as the A5:<arm> systems on the driver for a full-pipeline arm"}
  a10_knockouts: {tier: A, backend: laptop, covers: [A10], note: "retrieval and slot fill only, no drafting: seven stores, one at a time"}
  rq2_vision: {tier: A, backend: ada}
  rq2_full: {tier: A, backend: ada}
  f2_change_sets: {tier: A, backend: ada}
  f1_f5_f6: {tier: A, backend: ada}
  f3_baselines: {tier: A, backend: ada}
  f4_nocache: {tier: A, backend: ada}
  t6_tool_calling: {tier: A, backend: ada}
  t7_safety: {tier: A, backend: ada}
  qlora: {tier: A, backend: ada}
  s8_self_critique: {tier: A, backend: ada}
  s9_sampling_critic: {tier: A, backend: ada}
  s10_no_isolation: {tier: A, backend: ada}
  s1_critique_retrieval: {tier: A, backend: ada}
  s3_stopping: {tier: A, backend: ada}
  s7_gap_reread: {tier: A, backend: laptop, note: "mostly laptop (plan job 20); the case rows are T2 bundles"}
  s15_output_format: {tier: A, backend: ada, note: "S15b (free text then parse) is declared but not built; the 400-input field-accuracy arm is scored with the A5 harness"}
  s17_defences: {tier: A, backend: ada, note: "arms scored on T7 injection scenarios (attack success rate); the case rows are T7 scenarios"}
  s2_adaptive_depth: {tier: B, status: deferred, backend: ada}
  s6_b5_router: {tier: B, status: deferred, backend: ada, note: "S6 needs the store-prior artefact (`agents.sutradhar.store_prior train`); without it the prior is neutral and S6 equals Full"}
  s12_topology: {tier: B, status: deferred, backend: ada}
  s14_batch: {tier: B, status: deferred, backend: ada, note: "S14 and S14d share one in-memory retrieval cache across the run's cases"}
  s14_scheduling: {tier: B, status: deferred, backend: laptop, note: "urgency policy is read by the batch desk; measured on T5 (case rows with deadlines), not by a per-case Full run"}
  s16_chunking: {tier: B, status: deferred, backend: laptop, note: "the chunking switch is read by the retrieval-only study, not the per-case pipeline"}
  s4_s5_retrieval: {tier: B, status: deferred, backend: laptop, note: "scored by recall@10; plan 7.1: no Ada hours"}
  s11_review_debate: {tier: C, status: deferred, backend: ada}
  s13_workflow_search: {tier: C, status: deferred, backend: ada, note: "dev cases only; the search harness is eval/runners/workflow_search.py (no model-backed evaluator yet)"}
  s18_authority_stance: {tier: X, status: deferred, backend: ada, note: "added in sweep 4, not in the evaluation plan"}
  gold_source_sweep: {tier: A, backend: laptop, note: "rescoring only (no model call, cost 0): gold-dependent metrics of the existing outputs against the agreed gold (primary) and the rule-only gold (secondary); one declared sensitivity analysis, not a new Holm family. Needs eval/metrics (Harshita)"}
  p_munshi_variants: {tier: B, status: deferred, backend: ada, note: "P5, P6, P7, P8 are Munshi switches; they change a run only when a bundle is given"}

# (gold_source_sweep, below s13_workflow_search in `job_meta`, is rescoring only.)

# Variant ids that are declared in `Switches` but have no job, with the reason. The validator fails when a declared id is neither implemented-with-a-job nor listed here.
exclusions:
  S15b: "declared, behaviour not built: output_format='free_then_parse' is not read by any agent (agents/vakeel/agent.py says so); system_runner raises NotImplementedError"

# Capped hosted resources. `driver plan` sums the estimated spend per provider over the jobs it is given, in the provider's currency, and warns when a cap is exceeded.
budgets:
  openai_usd: 5.0                   # whole project (hard cap in code); the code's default cap is 4.5 (`openai_usd_code_default`); about 0.06 spent so far
  openai_usd_code_default: 4.5
  sarvam_cap_inr: 25                # default; env VS_SARVAM_CAP_INR overrides it (more credits may be added). pay-as-you-go, INR, excl. GST; 1 credit = INR 1. The Sarvam spend ledger (not built) must read the same value as a hard cap
  sarvam_model: sarvam-105b         # the model the estimate prices
  # Price per 1M tokens in INR (input / cached input / output). source: Sarvam dashboard 2026-10-26, reported by the owner (not verified in code; there is no price table in models/sarvam).
  sarvam_prices_inr_per_1m:
    sarvam-105b:       {input: 15,    cached: 5,    output: 60}
    deepseek-v4.1-flash: {input: 25,  cached: 0.5,  output: 105}
    mimo-v2.6-flash:   {input: 12.5,  cached: 0.25, output: 25}
    mimo-v2.6-pro:     {input: 40,    cached: 0.3,  output: 80}
    glm-5.3-flash:     {input: 13.5,  cached: 2.5,  output: 45}
    gemma-4:           {input: 35,    cached: 10,   output: 90}
    deepseek-v4-pro:   {input: 115,   cached: 4,    output: 350}
    glm-5.3:           {input: 126,   cached: 20,   output: 390}
    kimi-k3:           {input: 270,   cached: 27,   output: 1350}
  sarvam_other_inr: {translate_per_1000_chars: 2, stt_per_min: 0.49, tts_v3_per_1000_chars: 3, tts_v4_flash_per_1000_chars: 1, language_id_per_1000_chars: 0.35, note: "TTS V4 Flash price is a promotion until 12 Nov"}
  price_source: "dashboard 2026-10-26"
