[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vakeel_sahayak"
version = "0.0.1"
description = "Vakeel-Sahayak.ai: an agentic bail-preparation engine for legal-aid counsel (skeleton)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "networkx>=3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Dataset download and ingest: Open India Law Parquet streaming (scripts/download_datasets.sh, make datasets); huggingface_hub gives the `hf` command for make data and make models
data = ["pyarrow>=15", "requests>=2.31", "huggingface_hub>=0.34"]
# Optional dense backend for the hybrid stores and a faster cosine search; SQLite (FTS5 + vectors) works without it (plan §5.5)
lance = ["lancedb>=0.8", "numpy>=1.26"]
# Ingestion: layout parsing, OCR, image clean-up, Hindi translation (plan §4.2, §4.5)
ocr = ["docling>=2", "surya-ocr>=0.6", "pytesseract>=0.3", "opencv-python-headless>=4", "numpy>=1.26", "pillow>=10", "pillow-heif>=0.16", "IndicTransToolkit"]
# Vision-model transcription of hard pages: Qwen3-VL 4-bit on the laptop (plan §4.2 step 4)
vision = ["transformers>=4.45", "torch>=2.3", "accelerate>=0.34", "bitsandbytes>=0.43", "pillow>=10"]
# Hindi to English translation with IndicTrans2 (plan §4.5)
translation = ["transformers>=4.45", "torch>=2.3", "IndicTransToolkit"]
# Voice intake: Whisper (faster-whisper) or IndicConformer (transformers + torchaudio) (plan §4.5)
speech = ["faster-whisper>=1", "torchaudio>=2", "transformers>=4.45"]
# Model clients: vLLM on Ada, local 4B, embeddings, NLI, privacy (plan §12)
models = ["vllm>=0.6", "transformers>=4.45", "sentence-transformers>=3", "FlagEmbedding>=1.2", "presidio-analyzer>=2", "presidio-anonymizer>=2", "bitsandbytes>=0.43"]
# The real NLI claim checker (DeBERTa-v3) on CPU for hosted-model runs: pip install torch --index-url https://download.pytorch.org/whl/cpu, then this extra (weights: make models)
nli = ["torch>=2.3", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4"]
# QLoRA fine-tuning (plan §12)
train = ["torch>=2.3", "transformers>=4.45", "peft>=0.12", "trl>=0.10", "bitsandbytes>=0.43", "datasets>=3", "accelerate>=0.34"]
# Test-set construction and evaluation (plan §15)
eval = ["augraphy>=8", "faker>=25", "reportlab>=4", "jiwer>=3", "scipy>=1.11", "numpy>=1.26", "pandas>=2", "minicheck", "rapidfuzz>=3"]
# Test-set builders T2 to T9 (PDF rendering, degradation, synthetic names). PyMuPDF is AGPL-3.0: keep it out of any network-facing deployment (see NOTICE)
testsets = ["pymupdf>=1.24,<2", "pillow>=10", "numpy>=1.26", "faker>=25"]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vakeel_sahayak = ["contracts/factors/*.yaml", "testsets/specs/*.yaml", "export/templates/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B027"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu and not models'"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast, isolated tests mirroring the package layout (tests/unit)",
  "integration: several modules wired together with fakes (tests/integration)",
  "system: end-to-end scenarios of plan §13.6 flows and the T7 safety suite (tests/system)",
  "gpu: needs a GPU (vLLM, vision model); skipped by default",
  "models: needs real model weights (OCR, NLI, embeddings, LLM); skipped by default",
  "slow: takes more than a few seconds",
]
